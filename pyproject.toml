[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lvcr-ismir2019"          # ✅ 连字符（项目名）
version = "1.0.2"
description = "Large Vocabulary Chord Recognition"
requires-python = ">3.11.0"
dependencies = [
    "numpy>=1.20",
    "librosa>=0.9",
    # NOTE: On Python 3.11, unconstrained resolution may select old `numba/llvmlite`
    # versions that build but fail at install-time (e.g., llvmlite==0.36.*).
    # Explicitly requiring a modern numba prevents that and lets the resolver pick a
    # compatible numpy/llvmlite set.
    "numba>=0.57",
    "pydub>=0.25.1",
    "pretty-midi",
    "h5py>=3.11.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lvcr_ismir2019"]  # ✅ 指定包位置

[tool.uv.sources]
pretty-midi = { git = "https://github.com/chenkigba/pretty-midi.git" }
